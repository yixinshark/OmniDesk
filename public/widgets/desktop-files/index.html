<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>桌面文件</title>
  <script src="/widget-sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 10px; height: 100vh;
      display: flex; flex-direction: column;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: rgba(0, 0, 0, 0.15);
      color: #fff;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px; flex-shrink: 0;
    }
    .title { font-size: 0.82rem; font-weight: 600; color: rgba(255,255,255,0.9); letter-spacing: 0.5px; }
    .refresh {
      border: none; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85);
      width: 24px; height: 24px; border-radius: 7px; cursor: pointer;
      font-size: 0.85rem; line-height: 1; transition: all 0.15s;
    }
    .refresh:hover { background: rgba(255,255,255,0.2); }
    .refresh:active { transform: scale(0.92); }

    .content {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 2px;
    }
    .content::-webkit-scrollbar { width: 6px; }
    .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

    .section { margin-bottom: 8px; }
    .section-header {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.64rem; font-weight: 600; letter-spacing: 0.4px;
      color: rgba(255,255,255,0.55);
      padding: 2px 2px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 5px;
    }
    .section-header .count {
      margin-left: auto;
      background: rgba(255,255,255,0.12);
      border-radius: 8px; padding: 0 6px;
      font-size: 0.6rem; color: rgba(255,255,255,0.7);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 4px;
    }

    .item {
      display: flex; flex-direction: column; align-items: center;
      padding: 5px 2px; border-radius: 9px; cursor: pointer;
      transition: background 0.12s, transform 0.12s;
      user-select: none;
    }
    .item:hover { background: rgba(255,255,255,0.10); }
    .item.selected { background: rgba(255,255,255,0.22); }
    .item:active { transform: scale(0.96); }

    .icon {
      width: 36px; height: 36px; margin-bottom: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem; line-height: 1;
    }
    .icon img { width: 36px; height: 36px; object-fit: contain; display: block; }

    .label {
      font-size: 0.64rem; line-height: 1.2; text-align: center;
      width: 100%;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-all;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .state {
      height: 100%; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.55); font-size: 0.78rem; text-align: center; padding: 0 10px;
    }
    .toast {
      position: absolute; left: 10px; right: 10px; bottom: 10px;
      background: rgba(180,40,40,0.92); color: #fff;
      font-size: 0.72rem; padding: 6px 10px; border-radius: 8px;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="title">🗂️ 桌面文件</div>
    <button class="refresh" id="refresh" title="刷新">⟳</button>
  </header>
  <div class="content" id="content">
    <div class="state">加载中…</div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const bridge = window.__widgetBridge;
    const content = document.getElementById('content');
    const toastEl = document.getElementById('toast');
    let lastJson = "";
    let toastTimer = null;

    // 分区定义（顺序即展示顺序）
    const GROUPS = [
      { kind: 'dir',  icon: '📁', label: '文件夹', fallback: '📁' },
      { kind: 'app',  icon: '📦', label: '应用',   fallback: '📦' },
      { kind: 'file', icon: '📄', label: '文件',   fallback: '📄' },
    ];

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    function showState(text) {
      content.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'state';
      d.textContent = text;
      content.appendChild(d);
    }

    function makeItem(it, fallbackEmoji) {
      const el = document.createElement('div');
      el.className = 'item';
      el.title = it.name;

      const ic = document.createElement('div');
      ic.className = 'icon';
      if (it.icon) {
        const img = document.createElement('img');
        img.src = it.icon;
        img.alt = '';
        img.onerror = () => { ic.textContent = fallbackEmoji; };
        ic.appendChild(img);
      } else {
        ic.textContent = fallbackEmoji;
      }

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = it.name;

      el.appendChild(ic);
      el.appendChild(label);

      el.addEventListener('click', () => {
        document.querySelectorAll('.item.selected').forEach(n => n.classList.remove('selected'));
        el.classList.add('selected');
      });
      el.addEventListener('dblclick', () => {
        bridge.invoke('launch_desktop_entry', { path: it.path })
          .catch(err => toast('打开失败：' + err));
      });
      return el;
    }

    function render(items) {
      content.innerHTML = '';
      if (!items || items.length === 0) {
        showState('桌面空空如也');
        return;
      }

      // 按 kind 分组
      const buckets = {};
      for (const it of items) {
        (buckets[it.kind] = buckets[it.kind] || []).push(it);
      }

      for (const g of GROUPS) {
        const list = buckets[g.kind];
        if (!list || list.length === 0) continue;

        const section = document.createElement('div');
        section.className = 'section';

        const head = document.createElement('div');
        head.className = 'section-header';
        head.innerHTML =
          '<span>' + g.icon + '</span><span>' + g.label + '</span>' +
          '<span class="count">' + list.length + '</span>';
        section.appendChild(head);

        const grid = document.createElement('div');
        grid.className = 'grid';
        for (const it of list) grid.appendChild(makeItem(it, g.fallback));
        section.appendChild(grid);

        content.appendChild(section);
      }
    }

    async function load() {
      try {
        const items = await bridge.invoke('list_desktop_entries');
        const json = JSON.stringify(items);
        if (json === lastJson) return; // 无变化则不重绘，避免闪烁
        lastJson = json;
        render(items);
      } catch (e) {
        lastJson = "";
        showState('读取桌面失败');
        toast(String(e));
      }
    }

    document.getElementById('refresh').addEventListener('click', () => {
      lastJson = ""; // 强制重绘
      load();
    });

    // 屏蔽默认右键菜单（WebKit 自带的"重新加载/检查元素"等）；后续做自定义菜单可在此扩展
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    load();
    setInterval(load, 5000); // 轻量轮询，自动同步新增/删除
  </script>
</body>
</html>
