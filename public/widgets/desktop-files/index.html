<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>桌面文件</title>
  <script src="/widget-sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 10px; height: 100vh;
      display: flex; flex-direction: column;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: rgba(0, 0, 0, 0.15);
      color: #fff;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px; flex-shrink: 0;
    }
    .title { font-size: 0.82rem; font-weight: 600; color: rgba(255,255,255,0.9); letter-spacing: 0.5px; }
    .refresh {
      border: none; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85);
      width: 24px; height: 24px; border-radius: 7px; cursor: pointer;
      font-size: 0.85rem; line-height: 1; transition: all 0.15s;
    }
    .refresh:hover { background: rgba(255,255,255,0.2); }
    .refresh:active { transform: scale(0.92); }

    .content {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 2px;
    }
    .content::-webkit-scrollbar { width: 6px; }
    .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

    .section { margin-bottom: 8px; }
    .section-header {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.64rem; font-weight: 600; letter-spacing: 0.4px;
      color: rgba(255,255,255,0.55);
      padding: 2px 2px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 5px;
    }
    .section-header .count {
      margin-left: auto;
      background: rgba(255,255,255,0.12);
      border-radius: 8px; padding: 0 6px;
      font-size: 0.6rem; color: rgba(255,255,255,0.7);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 4px;
    }

    .item {
      display: flex; flex-direction: column; align-items: center;
      padding: 5px 2px; border-radius: 9px; cursor: pointer;
      transition: background 0.12s, transform 0.12s;
      user-select: none;
    }
    .item:hover { background: rgba(255,255,255,0.10); }
    .item.selected { background: rgba(255,255,255,0.22); }
    .item:active { transform: scale(0.96); }

    .icon {
      width: 36px; height: 36px; margin-bottom: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem; line-height: 1;
    }
    .icon img { width: 36px; height: 36px; object-fit: contain; display: block; border-radius: 4px; }

    .label {
      font-size: 0.64rem; line-height: 1.2; text-align: center;
      width: 100%;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-all;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .state {
      height: 100%; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.55); font-size: 0.78rem; text-align: center; padding: 0 10px;
    }
    .toast {
      position: absolute; left: 10px; right: 10px; bottom: 10px;
      background: rgba(180,40,40,0.92); color: #fff;
      font-size: 0.72rem; padding: 6px 10px; border-radius: 8px;
      opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 10001;
    }
    .toast.show { opacity: 1; }

    /* 右键菜单 */
    .ctx-menu {
      position: fixed; z-index: 9999; min-width: 132px;
      background: rgba(28,28,30,0.97);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 4px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
      font-size: 0.74rem; user-select: none;
    }
    .ctx-item {
      padding: 7px 10px; border-radius: 6px; cursor: pointer;
      color: rgba(255,255,255,0.9); white-space: nowrap; transition: background 0.1s;
    }
    .ctx-item:hover { background: rgba(255,255,255,0.14); }
    .ctx-sep { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 6px; }
    .ctx-item.danger { color: #ff7070; }
    .ctx-item.danger:hover { background: rgba(255,80,80,0.18); }

    /* 删除确认 */
    .confirm-mask {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; padding: 14px;
    }
    .confirm-box {
      background: rgba(34,34,38,0.98);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; padding: 14px; width: 100%;
      box-shadow: 0 14px 36px rgba(0,0,0,0.55);
    }
    .confirm-title { font-size: 0.82rem; font-weight: 600; margin-bottom: 8px; }
    .confirm-msg { font-size: 0.72rem; color: rgba(255,255,255,0.82); line-height: 1.5; margin-bottom: 14px; word-break: break-all; }
    .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .confirm-actions button { border: none; border-radius: 8px; padding: 6px 14px; font-size: 0.72rem; cursor: pointer; transition: all 0.12s; }
    .btn-cancel { background: rgba(255,255,255,0.12); color: #fff; }
    .btn-cancel:hover { background: rgba(255,255,255,0.2); }
    .btn-delete { background: #e03131; color: #fff; }
    .btn-delete:hover { background: #f03e3e; }
  </style>
</head>
<body>
  <header>
    <div class="title">🗂️ 桌面文件</div>
    <button class="refresh" id="refresh" title="刷新">⟳</button>
  </header>
  <div class="content" id="content">
    <div class="state">加载中…</div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const bridge = window.__widgetBridge;
    const content = document.getElementById('content');
    const toastEl = document.getElementById('toast');
    let lastJson = "";
    let toastTimer = null;
    let reloadTimer = null;

    const GROUPS = [
      { kind: 'dir',  icon: '📁', label: '文件夹', fallback: '📁' },
      { kind: 'app',  icon: '📦', label: '应用',   fallback: '📦' },
      { kind: 'file', icon: '📄', label: '文件',   fallback: '📄' },
    ];

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }
    function showState(text) {
      content.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'state';
      d.textContent = text;
      content.appendChild(d);
    }

    // ---------- 右键菜单 ----------
    const menu = document.createElement('div');
    menu.className = 'ctx-menu';
    menu.style.display = 'none';
    document.body.appendChild(menu);
    function hideMenu() { menu.style.display = 'none'; }

    // [label, danger, separatorBefore, action]
    const MENU_ITEMS = [
      { label: '打开',             run: it => bridge.invoke('launch_desktop_entry', { path: it.launch }) },
      { label: '在文件管理器中显示', run: it => bridge.invoke('reveal_path', { path: it.path }) },
      { label: '复制路径',          run: it => bridge.invoke('copy_text', { text: it.path }).then(() => toast('已复制路径')) },
      { sep: true },
      { label: '移到回收站',        run: it => actThenReload('trash_path', { path: it.path }, '移到回收站') },
      { label: '删除',  danger: true, run: it => confirmDelete(it) },
    ];

    function showMenu(it, x, y) {
      menu.innerHTML = '';
      for (const mi of MENU_ITEMS) {
        if (mi.sep) {
          const s = document.createElement('div');
          s.className = 'ctx-sep';
          menu.appendChild(s);
          continue;
        }
        const row = document.createElement('div');
        row.className = 'ctx-item' + (mi.danger ? ' danger' : '');
        row.textContent = mi.label;
        row.addEventListener('click', (e) => {
          e.stopPropagation();
          hideMenu();
          Promise.resolve(mi.run(it)).catch(err => toast(mi.label + '失败：' + err));
        });
        menu.appendChild(row);
      }
      menu.style.display = 'block';
      const mw = menu.offsetWidth, mh = menu.offsetHeight;
      const vw = window.innerWidth, vh = window.innerHeight;
      if (x + mw > vw) x = Math.max(2, vw - mw - 2);
      if (y + mh > vh) y = Math.max(2, vh - mh - 2);
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';
    }

    async function actThenReload(cmd, args, label) {
      try { await bridge.invoke(cmd, args); load(); }
      catch (e) { toast((label || '操作') + '失败：' + e); }
    }

    // ---------- 删除确认 ----------
    const mask = document.createElement('div');
    mask.className = 'confirm-mask';
    mask.style.display = 'none';
    mask.innerHTML =
      '<div class="confirm-box">' +
        '<div class="confirm-title">永久删除</div>' +
        '<div class="confirm-msg" id="confirm-msg"></div>' +
        '<div class="confirm-actions">' +
          '<button class="btn-cancel" id="confirm-cancel">取消</button>' +
          '<button class="btn-delete" id="confirm-ok">删除</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);
    const confirmMsg = mask.querySelector('#confirm-msg');
    let pendingDelete = null;
    function hideConfirm() { mask.style.display = 'none'; pendingDelete = null; }
    mask.querySelector('#confirm-cancel').addEventListener('click', hideConfirm);
    mask.addEventListener('mousedown', (e) => { if (e.target === mask) hideConfirm(); });
    mask.querySelector('#confirm-ok').addEventListener('click', () => {
      if (!pendingDelete) return;
      const it = pendingDelete;
      hideConfirm();
      actThenReload('delete_path', { path: it.path }, '删除');
    });
    function confirmDelete(it) {
      pendingDelete = it;
      confirmMsg.textContent = '确定永久删除「' + it.name + '」？此操作不可恢复。';
      mask.style.display = 'flex';
    }

    // 全局关闭菜单
    document.addEventListener('click', hideMenu);
    document.addEventListener('scroll', hideMenu, true);
    document.addEventListener('contextmenu', (e) => e.preventDefault()); // 兜底屏蔽默认右键菜单
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { hideMenu(); hideConfirm(); } });

    // ---------- 渲染 ----------
    function makeItem(it, fallbackEmoji) {
      const el = document.createElement('div');
      el.className = 'item';
      el.title = it.name;

      const ic = document.createElement('div');
      ic.className = 'icon';
      if (it.icon) {
        const img = document.createElement('img');
        img.src = it.icon;
        img.alt = '';
        img.onerror = () => { ic.textContent = fallbackEmoji; };
        ic.appendChild(img);
      } else {
        ic.textContent = fallbackEmoji;
      }

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = it.name;

      el.appendChild(ic);
      el.appendChild(label);

      const select = () => {
        document.querySelectorAll('.item.selected').forEach(n => n.classList.remove('selected'));
        el.classList.add('selected');
      };
      el.addEventListener('click', select);
      el.addEventListener('dblclick', () => {
        bridge.invoke('launch_desktop_entry', { path: it.launch })
          .catch(err => toast('打开失败：' + err));
      });
      el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        select();
        showMenu(it, e.clientX, e.clientY);
      });
      return el;
    }

    function render(items) {
      content.innerHTML = '';
      if (!items || items.length === 0) {
        showState('桌面空空如也');
        return;
      }
      const buckets = {};
      for (const it of items) {
        (buckets[it.kind] = buckets[it.kind] || []).push(it);
      }
      for (const g of GROUPS) {
        const list = buckets[g.kind];
        if (!list || list.length === 0) continue;

        const section = document.createElement('div');
        section.className = 'section';

        const head = document.createElement('div');
        head.className = 'section-header';
        head.innerHTML =
          '<span>' + g.icon + '</span><span>' + g.label + '</span>' +
          '<span class="count">' + list.length + '</span>';
        section.appendChild(head);

        const grid = document.createElement('div');
        grid.className = 'grid';
        for (const it of list) grid.appendChild(makeItem(it, g.fallback));
        section.appendChild(grid);

        content.appendChild(section);
      }
    }

    async function load() {
      try {
        const items = await bridge.invoke('list_desktop_entries');
        const json = JSON.stringify(items);
        if (json === lastJson) return; // 无变化则不重绘，避免闪烁
        lastJson = json;
        render(items);
      } catch (e) {
        lastJson = "";
        showState('读取桌面失败');
        toast(String(e));
      }
    }
    function scheduleReload() {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(load, 250); // 去抖
    }

    document.getElementById('refresh').addEventListener('click', () => {
      lastJson = ""; // 强制重绘
      load();
    });

    // 文件监听事件驱动刷新（替代高频轮询）
    bridge.on('desktop-changed', scheduleReload);

    load();
    setInterval(load, 60000); // 兜底轮询：notify 偶发漏事件时的安全网
  </script>
</body>
</html>
